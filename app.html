<!DOCTYPE html>
<!--
  《擺手起家》GitHub 殼（2026-11-08）
  這個檔案只負責：在 GitHub 上開鏡頭、連 MQTT（remote_mqtt.js），上傳一次就不用再改。
  畫面本身放在 Apps Script 的「Screen」檔案裡，網址帶 ?src=<Apps Script 的 /exec 網址>，
  這裡會去拿 src?file=screen 的內容，整頁換上去。
  改畫面 → 只改 Apps Script 的 Screen；換版本 → 在 Apps Script「管理部署作業」選版本。
-->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>擺手起家</title>
  <style>
    body { margin: 0; background: #050510; color: #e8e9f6; font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; letter-spacing: 2px; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div id="loading">畫面載入中…</div>
  <script>
    (async function () {
      const msg = t => { const el = document.getElementById('loading'); if (el) el.textContent = t; };
      const KEY = 'baishou-src';
      let src = new URLSearchParams(location.search).get('src');
      try { if (src) localStorage.setItem(KEY, src); else src = localStorage.getItem(KEY); } catch (e) {}
      if (!src) { msg('沒有畫面網址：請從 Apps Script 的網址打開'); return; }

      let html;
      try {
        const res = await fetch(src + (src.includes('?') ? '&' : '?') + 'file=screen&t=' + Date.now());
        html = await res.text();
      } catch (e) { msg('拿不到畫面：' + e.message); return; }
      if (!/<script/i.test(html)) { msg('拿到的不是畫面，請檢查 Apps Script 的 Screen 檔案'); console.log(html); return; }

      // 把 Screen 的 <head> 樣式和 <body> 內容換上來，再照順序執行裡面的 <script>
      const doc = new DOMParser().parseFromString(html, 'text/html');
      if (doc.title) document.title = doc.title;
      doc.querySelectorAll('head style, head link[rel=stylesheet]').forEach(n => document.head.appendChild(n));
      const scripts = [...doc.querySelectorAll('script')];
      scripts.forEach(s => s.remove());
      document.body.innerHTML = doc.body.innerHTML;
      for (const old of scripts) {
        const s = document.createElement('script');
        if (old.src) {
          s.src = old.getAttribute('src');
          await new Promise((ok, bad) => { s.onload = ok; s.onerror = () => bad(new Error('載入失敗 ' + s.src)); document.body.appendChild(s); });
        } else {
          s.textContent = old.textContent;
          document.body.appendChild(s);
        }
      }
      // p5 在頁面載入完之後才進來，要手動啟動
      if (window.p5 && !p5.instance && (typeof setup === 'function' || typeof draw === 'function')) new p5();
    })();
  </script>
</body>
</html>
