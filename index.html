<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>擺手起家（MQTT）</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <style>
    body {
      margin: 0; padding: 0; overflow: hidden;
      background-color: #050510;
      font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      user-select: none;
    }

    /* 開始按鈕 */
    #startButton {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 50px; font-size: 24px; color: white; font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50px; cursor: pointer; z-index: 100;
      backdrop-filter: blur(10px); transition: 0.3s; letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }
    #startButton:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
      transform: translate(-50%, -50%) scale(1.05);
    }

    /* 右上角裝置面板：平常收成一顆小膠囊，點一下展開 */
    #hud {
      position: absolute; top: 16px; right: 16px; z-index: 100;
      color: rgba(232, 233, 246, 0.9); font-size: 13px;
      background: rgba(20, 20, 40, 0.55); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 18px;
      overflow: hidden; min-width: 150px;
    }
    #hudToggle {
      all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; width: 100%; box-sizing: border-box; letter-spacing: 1px;
    }
    #hudDot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; }
    #hudDot.ok { background: #fff; }
    #hudArrow { margin-left: auto; font-size: 14px; transition: transform 0.25s; }
    #hud.open #hudArrow { transform: rotate(90deg); }
    #hudBody { display: none; padding: 4px 14px 14px; }
    #hud.open #hudBody { display: block; }
    #hudBars { display: flex; gap: 6px; margin-bottom: 12px; }
    .bar {
      position: relative; width: 26px; height: 44px; border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.35); overflow: hidden;
    }
    .bar.grab { border: 3px solid #fff; }
    .bar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255, 255, 255, 0.75); }
    .bar span { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 11px; mix-blend-mode: difference; }
    .hudBtn {
      all: unset; cursor: pointer; display: block; text-align: center; margin-top: 6px;
      width: 100%; box-sizing: border-box; padding: 6px 0; border-radius: 12px; font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .hudBtn:hover { background: rgba(255, 255, 255, 0.15); }

    /* 操作說明：上方中間一張小卡，開始後 12 秒自己淡出，按「操作說明」再叫出來 */
    #instruction-panel {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 28px; padding: 12px 26px;
      background: rgba(20, 20, 40, 0.55); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px;
      color: rgba(232, 233, 246, 0.9);
      pointer-events: none; opacity: 0; transition: opacity 1.2s;
    }
    #instruction-panel.show { opacity: 1; }
    .instr-box { text-align: center; }
    .instr-title { font-size: 11px; color: #9a9ab8; margin-bottom: 6px; letter-spacing: 3px; text-transform: uppercase; }
    .instr-action { font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  </style>
</head>
<body>

  <button id="startButton">ENTER UNIVERSE</button>
  <div id="hud">
    <button id="hudToggle"><span id="hudDot"></span><span id="hudStatus">裝置：未連接</span><span id="hudArrow">▸</span></button>
    <div id="hudBody">
      <div id="hudBars"></div>
      <button id="deviceButton" class="hudBtn">連接裝置</button>
      <button id="helpButton" class="hudBtn">操作說明</button>
    </div>
  </div>

  <div id="instruction-panel">
    <div class="instr-box">
      <div class="instr-title">Wave</div>
      <div class="instr-action">揮手吹起風、撥開星點 · 手的高度彈出音</div>
    </div>
    <div class="instr-box">
      <div class="instr-title">Together</div>
      <div class="instr-action">手在哪一欄，那片陶片亮燈 · 對方抓陶片，星空炸開</div>
    </div>
  </div>

  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <script src="remote_mqtt.js"></script>
  <script src="sketch.js"></script>

</body>
</html>
